name: kreiseck_validator
description: >-
  Zero-dependency validation, normalization and formatting for email, phone,
  URL, host, IBAN, BIC, VAT-ID, GTIN, credit-card, license-plate, IMEI, ICCID,
  MAC, VIN, postal-code and Austrian social-security, company-register and tax
  numbers. Global phone support; DACH-aware. By Kreiseck.
version: 0.12.0
homepage: https://kreiseck.com
repository: https://github.com/kreiseck-at/kreiseck_validator
issue_tracker: https://github.com/kreiseck-at/kreiseck_validator/issues
documentation: https://pub.dev/documentation/kreiseck_validator/latest/
topics:
  - validation
  - formatting
  - email
  - phone
  - iban
environment:
  sdk: ">=3.0.0 <4.0.0"
dev_dependencies:
  lints: ^4.0.0
  test: ^1.24.0
